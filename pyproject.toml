[project]
name = "jiaoyi"
version = "0.1.0"
description = "AI 交易机器人币安版：快慢双回路的“大脑”，执行交给 hummingbot-api"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27",
    "websockets>=14,<17",       # 币安行情 WebSocket（快环）
    "typesafe-sdk>=0.7.5,<0.8", # Jev 官方 SDK（TypeSafe AI，MIT）
]

[project.optional-dependencies]
# 预测员（Kronos）才需要；官方源码另拉：make kronos-fetch，见 src/jiaoyi/predictor/README.md
kronos = [
    "torch>=2.0,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "einops==0.8.1",
    "huggingface_hub==0.33.1",
    "safetensors==0.6.2",
]
# 军师团：TradingAgents v0.7.0（Apache-2.0）作为依赖，不复制代码；M2 才需要装。钉提交号。
slow = [
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents@e8f5503e9b86d5c2710b0c76b1f686703968c9df",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
jiaoyi = "jiaoyi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/jiaoyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 中文文档里的全角标点是故意的
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["jiaoyi"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tradingagents.*", "langchain_core.*"]
ignore_missing_imports = true
