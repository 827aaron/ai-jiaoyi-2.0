# 慢环（军师团）的成本和节奏。可选：没有 config/slow.toml 就用默认值 + 持仓档位的默认。
# 复制成 config/slow.toml 再改。这里不放任何风控数值，硬上限只在 risk.toml。

[llm]
provider = "deepseek"    # deepseek=直连（DEEPSEEK_API_KEY）；openrouter=经 OpenRouter（OPENROUTER_API_KEY）

[social]
reddit = "guarded"      # guarded=抓 Reddit 但加闸（匿名 RSS 每分钟约 1 次，失败后冷却 10 分钟）；off=不抓

[levels]
span_sigma = 1.5      # 关键位范围 = 系数 × 该币 ATR × √(持仓时长/ATR 周期)；所有币所有档位同一条公式

# 分档交易（设计文档 §六）：头部档开放交易；中间档军师每天挑几个、仓位档位封顶；尾部档只看不做
# [screener.tiers]
# enabled = true                   # false = 不分档，整个候选池都参与开会
# head = 10                        # 头部档几个（固定 / 手动加入的币一律算头部）
# mid = 15                         # 中间档几个；再往后是尾部
# mid_daily_pick = 5               # 中间档每天（曼谷日）最多挑几个交易
# mid_size_max = "S"               # 中间档仓位档位最大封到哪一档
# always_candidates = ["BTC", "ETH"]  # 每轮都进总盘会候选的币（过了硬门槛就进池，不算头部、不占中间档名额）
# 美股类别（us_events / us_open_bonus 写在下面 [screener] 里）：开盘期间加分，财报日前后标注
# 按类别开关和每类上限（选币页上的设置优先于这里）：
# [screener.categories.us_tech]
# enabled = false                  # 这一类不再靠打分进池；你固定 / 手动加入的币仍进池
# [screener.categories.alt]
# cap = 10                         # 山寨币最多进池 10 个；不写 = 用 default_category_cap
[screener]                         # 选币器：每小时筛一遍全部币安 U 本位永续，过门槛、打分、取前 N 个进候选池（不用 AI）
min_quote_volume_usdt = 20000000   # 最低 24 小时成交额（美元），推荐 2000 万
# max_spread_bps = 5               # 最大买卖价差（万分之几）；不写 = 跟硬上限里的「最大价差」走
min_depth_usdt = 100000            # 盘口最小深度（美元），推荐 10 万
min_listed_days = 7                # 至少上线几天，推荐 7
min_range_24h_pct = 0              # 24 小时波动下限（%），0 = 不设；推荐 1.5
max_range_24h_pct = 0              # 24 小时波动上限（%），0 = 不设；推荐 30
default_category_cap = 30          # 每一类币默认最多进池几个（选币页单独改过的以选币页为准）；0 = 不限
major_top_n = 20                   # 主流币 = 市值前几名（每天自动更新，去掉稳定币和包装币）；0 = 只用写死的 7 个
# major_include = ["LINK"]        # 手动加入主流币的币名
# major_exclude = ["DOGE"]        # 手动排除出主流币的币名（按山寨币算）
allow_tradfi = false               # 美股 / 金属永续（TRADIFI_PERPETUAL）是否进池：默认关，Demo 上验证完整条链再开
us_events = true                   # 美股类别（币股 / 美股科技）：开盘期间加分、财报日前后标注，军师团新闻带上财报日
us_open_bonus = 0.08               # 美股常规盘开盘期间加多少分（总分满分约 1；0 = 不加）
vol_full_multiple = 30             # 打分：按每小时折算的正常波动是来回手续费的几倍算满分（30 = 每小时 3%）
surge_full_multiple = 8            # 打分：最近 1 小时成交额是平时的几倍算满分
funding_full = 0.001               # 打分：资金费率绝对值到多少算满分（0.001 = 0.1%）
oi_full_pct = 10                   # 打分：持仓量一小时变化多少 % 算满分
liq_full_usdt = 10000000           # 打分：近 1 小时强平额多少美元算满分
weight_volatility = 0.35           # 五项权重（不用加起来等于 1，只看相对大小，不能全是 0）
weight_volume_surge = 0.25
weight_funding = 0.15
weight_oi = 0.15
weight_liquidations = 0.10

[meeting]
analysts_crypto = ["market", "social", "news"]                 # 分析师越少越省钱
analysts_stock  = ["market", "social", "news", "fundamentals"]
debate_rounds = 1        # 多空辩论轮数 0–3
risk_rounds   = 1        # 风控讨论轮数 0–3
# analyst_klines = ["15m x 96", "1h x 72", "4h x 60"]  # 分析师看的 K 线（周期 x 根数，从细到粗）；不写 = 按最长持仓档：30m 5m x 48 / 15m x 48 / 1h x 48；1h、2h 5m x 48 / 15m x 96 / 1h x 72；4h 就是这一组；8h 起 1h x 72 / 4h x 90 / 1d x 60
# quick_model / deep_model 不写 = 用所选 provider 的默认模型
# （两档默认都是 DeepSeek 4.1：deepseek 直连 deepseek-flash；openrouter deepseek/deepseek-v4.1-flash）
pick_tier    = "quick"   # 总盘会（挑币）用 quick（flash，便宜）还是 deep（pro）
convert_tier = "quick"   # 把结论整理成作战指令那一步
reasoning_effort = "low"                  # 推理长度：none/low/medium/high；只对走 OpenRouter 的通道生效，思考太长会把 max_tokens 用满
# max_tokens = 16384                      # 不写 = 16384（和模型最大输出取小）：OpenRouter 按它预留额度，写太大并发开会会因余额预留不够成批 402；写了按你的，
                                          # 思考模型的思考也算在内，4096 实测会让辩论回答变空，别调低
retry_bad_steps = true                    # 某一步回答被截断 / 空 / 过短：自动重试一次（关掉推理、提示直接给结论），仍不行才整场失败
speech_min_chars = 50                     # 质量门槛：每个辩手每轮发言至少多少字，低于这场会不能用（0 = 只查空）
report_min_chars = 50                     # 分析师报告至少多少字，低于算缺失（行情技术缺了整场失败；新闻/社交/基本面缺了仓位档位下调一级）
retry_min_chars = 20                      # 回答少于多少字算过短
max_retries = 6
# 偏空整改（默认全是现状；见 src/jiaoyi/slow/bias_fix.py）
# debate_first = "bull"          # 多空辩论谁先说：bull（现状，空头最后说）/ bear / alternate（按会议交替）
# funding_label = "legacy"       # 资金费率说明：legacy（正费率=多头拥挤，现状）/ neutral（谁付谁 + 基准 +0.01%/8h，按结算间隔折算）
# bear_bull_symmetry = "legacy"  # legacy（现状）/ mirror（多空提示词逐句对称，经理 / 共用说明里的单边写法补齐另一边）
# crowd_ratio_mode = "raw"       # 账户多空比：raw（原值）/ relative（加相对 30 天中位数的偏离）
# bias_fix_ab = 0.0              # 0 = 上面四项每场会都按配置；0.5 = 每个改了的开关各自独立一半会议开、一半现状（析因对照）
#                                  推荐 Demo：debate_first = "bear"、funding_label = "neutral"、bear_bull_symmetry = "mirror"、crowd_ratio_mode = "relative"、bias_fix_ab = 0.5
# 输入新鲜度（默认全是现状；见 docs/slow.md「会议输入的新鲜度」）
# snapshot_interval = "15m"      # 行情分析师的已收盘快照和指标用几分钟 K 线（5m / 15m / 30m / 1h / 4h）；不写 = 按最长持仓档（4h 档是 1h）
# snapshot_label = "legacy"      # legacy（快照叫 source of truth，现状）/ neutral（写明最后一根已收盘 K 线几点收、距现在几分钟）
# live_price_line = false        # 会议说明加实时价一行（现价、离最后收盘涨跌、未收盘那根标 partial），转卡前再取一次
# stale_on_arrival = false       # 转卡后现价已越过失效价、或进场区间整段在价格错误一侧 → 观望（stale_on_arrival）
# input_time_labels = "legacy"   # legacy / explicit（表格 takerBuy / OI 写明哪个已收盘小时，单币资金费率写「上次结算 HH:MM」+ 实时估算）
# market_table_rolling = false   # 总盘会另给滚动 60 分钟涨跌家数（截到开会这一刻）
# latest_market_regime = false   # 整轮里每个单币会开始时用最新发布的大盘判断（关 = 本轮开始时的）
# event_brief_refresh = false    # 临时会开会前刷新大盘简报（10 分钟缓存）
#                                  推荐 Demo：全部打开，snapshot_interval = "15m"

[schedule]
# 这一段不写的键取 app.toml 所选持仓档位的默认（core/profiles.py）；写了就覆盖档位。下面注释里是 2h 档的值
# max_cards_per_round = 10         # 每轮最多出几张作战卡（几个标的开会）；不超过 app.toml 的 card_pick_max；0 = 不限（只受 card_pick_max 管）
# concurrency = 8                  # 同时开几个标的的会议 1–8
# card_ttl_min = 140              # 作战卡有效期（分钟）= 开会间隔 + 提前量（2h 140 / 60m 80 / 30m 50 / 15m 35）
# symbol_min_interval_min = 115   # 同一个币两次会议的最小间隔 5–720 分钟（≤ 开会间隔）
# refresh_lead_min = 20            # 卡到期前多久开会换卡 5–60 分钟，要大于一轮会议耗时（不写也不在档位里时 20）
# symbol_timeout_s = 900           # 单个标的的会议超时
# min_refresh_gap_min = 120       # 两轮开会的最小间隔（分钟），突破 / 新入池也要等；档位默认 = 档位分钟数（2h 档 120）
# event_meeting_enabled = true    # 临时会：出了事件只给那一个币补开一场（2h 起默认开，15m–1h 关）
# event_triggers = ["key_level_break", "move_since_card", "new_head_symbol"]  # 另有 predictor_against_card / signal_against_card / news_high_impact / stale_card_on_entry
# event_symbol_gap_min = 60       # 同一个币两场会（含正式会）至少隔多久；0 = 不限（内部仍隔 5 分钟，失败的会这个币另隔 15 分钟）
# event_max_per_day = 12          # 每个交易日最多几场临时会；0 = 不限
# key_level_trigger = "outside"  # key_level_break 怎么算：outside = 价格在关键位外侧就算（还在外面就隔够间隔再开）；cross = 出卡后价格从里侧穿到外侧那一下才算，出卡时已在外侧的位要等回到里侧再穿
# move_since_card_atr = 3.0       # 离上次开会的价格走了几倍 ATR 算 move_since_card
# predictor_against_runs = 2      # 预测员连续几次看反作战卡才算
# entry_max_card_age_min = 360    # 开仓前卡龄上限（分钟，12h 360 / 24h 480；0 = 不查）：超了这次信号不开，先补会
# schedule_at = "08:00"           # 每天固定时间（曼谷）开整轮会，24h 档默认；不写 = 按开会间隔
# over_budget = "slow"            # 花到日上限 80%：slow = 放慢一档；stop = 不放慢（15m–2h 默认 slow，6h 起 stop）
# slowdown_interval_min = 360     # 放慢后的开会间隔（分钟）；默认 = 下一档

[budget]
# daily_cost_limit_usd = 20.0              # 档位：每个交易日（曼谷 0 点清零）最多花多少美元；超了当天不再开会并推送提醒（15m 75 / 30m 40 / 1h 30 / 2h 20 / 6h 10 / 12h、24h 5）；你写多少就是多少；0 = 不限（不停开会、也不放慢，花过本档默认上限只推一条提醒）
failed_meeting_cost_usd = 0.05             # 失败的会议拿不到真实用量时，按这个估算价计入日花费
# fail_backoff_minutes = [5, 10, 30]       # 档位：开会连续失败后依次等多久再试，成功清零（15m 2,5,10 / 30m 3,5,10 / 1h 5,10,15 / 2h 5,10,30 / 6h+ 10,30,60）

[prices]                           # 每百万 token 的美元价，只在通道没报真实花费时估算用（OpenRouter 直接用它返回的 usage.cost）
flash_in = 0.30                    # OpenRouter deepseek/deepseek-v4.1-flash 标价，2026-10-23 核对
flash_out = 1.20
pro_in = 0.50
pro_out = 2.00
