# 慢环（军师团）的成本和节奏。可选：没有 config/slow.toml 就用这里写的默认值（与现在行为一致）。
# 复制成 config/slow.toml 再改。这里不放任何风控数值，硬上限只在 risk.toml。

[llm]
provider = "deepseek"    # deepseek=直连（DEEPSEEK_API_KEY）；openrouter=经 OpenRouter（OPENROUTER_API_KEY）

[meeting]
analysts_crypto = ["market", "social", "news"]                 # 分析师越少越省钱
analysts_stock  = ["market", "social", "news", "fundamentals"]
debate_rounds = 1        # 多空辩论轮数 0–3
risk_rounds   = 1        # 风控讨论轮数 0–3
# quick_model / deep_model 不写 = 用所选 provider 的默认模型
# （两档默认都是 DeepSeek 4.1：deepseek 直连 deepseek-flash；openrouter deepseek/deepseek-v4.1-flash）
pick_tier    = "quick"   # 总盘会（挑币）用 quick（flash，便宜）还是 deep（pro）
convert_tier = "quick"   # 把结论整理成作战指令那一步
max_tokens  = 8192
max_retries = 6

[schedule]
# max_cards_per_round = 10         # 每轮最多出几张作战卡（几个标的开会）；不写 = 用 app.toml 的 card_pick_max
concurrency = 4                    # 同时开几个标的的会议 1–8
card_ttl_hours = 2.0               # 作战卡有效期 1–4 小时
symbol_min_interval_hours = 2.0    # 同一个币两次会议的最小间隔 0.5–12 小时

[budget]
daily_cost_limit_usd = 10.0                # 每个交易日（曼谷 0 点清零）最多花多少美元；超了当天不再开会并推送提醒
fail_backoff_minutes = [5, 10, 30]         # 开会连续失败后依次等多久再试，成功清零

[prices]                           # 每百万 token 的美元价，只用于花费统计；M2 真机验证时按官网核对
flash_in = 0.15
flash_out = 0.60
pro_in = 0.50
pro_out = 2.00
