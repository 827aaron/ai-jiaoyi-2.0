# frozen_peak_evidence_interval_s = 30   # background：每笔仓隔几秒读一次证据（5–600）。Demo 建议 20
# frozen_peak_evidence_max_age_s = 90    # background：缓存超过这么久本次复查不看冻结盈利价（0 = 不限；非 0 时至少上一项 + 30）。Demo 建议 60
# giveback_on = true               # 回吐保护开关（代码规则）：最高浮盈到过 giveback_arm_r 后，从最高点吐掉 giveback_close_pct 就全平
# giveback_close_pct = 45           # 回吐保护：吐掉最高浮盈的 45%
