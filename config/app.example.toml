# 运行配置。复制成 config/app.toml 再改：make init-config
# 每一项都必填（标“档位”的可以不写，由档位给）；超出合理范围拒绝启动。

mode = "paper"               # paper（模拟盘）/ testnet / live；切 live 另需确认词和面板密码
meeting_interval = "2h"      # 开会间隔档：15m / 30m / 1h / 2h（默认）/ 6h / 12h / 24h；卡有效期 = 间隔 + 20 分钟
hold = "4h"                  # 最长持仓档：30m / 1h / 2h / 4h（默认）/ 8h / 12h / 24h；30m 只能 paper
                             # 两个档位各选各的，给出下面标“档位”的键的默认值（数值见 src/jiaoyi/core/profiles.py）；
                             # 你写了的键优先，想让档位生效就别写。切档要重启；旧的 profile 键自动当 meeting_interval
# predictor_enabled = true   # 档位：预测员 Kronos 开关
# signal_dedup_s = 300        # 同一币同信号同方向的冷却秒数；不写跟最长持仓档（30m 60 / 1h 120 / 2h 300 / 4h 及以上 600）
jev_timeout_ms = 1500        # Jev 超时就放弃本次开仓（M1 实测经 OpenRouter 首次 963ms，之后约 500ms）
jev_max_concurrent = 4       # 拍板人同时最多判几个信号（不同币并行；同币排队只留最新一条）
# keeper_jev_timeout_ms = 0   # 持仓管家问 Jev 的超时（毫秒）：0 = 和 jev_timeout_ms 一样（默认，原行为）；管家超时只是本轮维持现状、还会重试 1 次，建议 6000；开仓拍板的 jev_timeout_ms 不放宽；改后重启
#   回滚到没有 keeper_jev_timeout_ms 的旧版本前，先删掉这一行：旧版配置不认识的键（extra=forbid）会拒绝启动
# jev_shared_cooldown = true  # 开仓拍板和持仓管家共用一份 Jev 连错计数和冷却（默认，原行为）；false = 各算各的，管家连错不会让开仓拍板进冷却（通道 / 模型 / 超时照旧共用），管家的 Jev 状态显示在管家的灯上；改后重启
# account_read_retries = 0    # 拍板通过后开仓前读账户失败，隔 1 秒再读几次（0–3）；都失败记风控员拒绝「读账户失败，本信号放弃」；只对很快失败的（连不上 / 5xx）有用，信号剩不到 1 秒不再重读；重读成功后再查暂停 / 重启 / 信号过期；0 = 不重读（默认）；热生效
#   回滚到没有这两项的旧版本前，先删掉这两行：旧版配置不认识的键（extra=forbid）会拒绝启动
# keeper_interval_s = 20     # 最长持仓档：持仓管家多久看一次（30m 10 秒 / 1h 15 / 2h 20 / 4h 30）
reconcile_interval_s = 30    # 对账员每 30 秒核对一次
# protection_stale_s = 120   # 面板：交易所保护单的观测超过 120 秒标“数据过期”；0 = 不标
# slow_loop_interval_min = 60  # 开会间隔档 = 军师团开会间隔（15m 15 分钟 … 1h 60 … 24h 1440）
# pool_size = 40             # 每次选多少个币进候选池；不写 = 跟档位（现在各档都是 40）
# card_pick_max = 20         # 军师每次最多挑几个；不写 = 跟档位（现在各档都是 20）
data_dir = "data"            # 决策日志、模块状态写在这里
# sim_environment = "demo"   # paper / testnet 连哪个模拟环境：demo（币安 Demo Trading，默认）/ legacy_testnet（旧测试网，已停用）
# notify_open_filled = true    # Telegram 各类告警的开关（默认都开）：notify_close_done / notify_lifeboat_hit / notify_order_failed 等，见网页「设置 → 告警推送」
# reconciler_close_unknown_positions = false  # 对账员遇到“不认识的仓位”：false = 只告警（默认）；true = 直接平掉。M4 前由你决定
# reconciler_executor_stop_retry_rounds = 0  # 对账员停执行器（只停不平）结果不明后，再过几轮仍没终止就再发一次停止；0 = 永不重发（默认）
# reconcile_opening_grace_s = 0   # 对账员：新仓建账后几秒内，「托管还没到 armed」「运行列表暂时没返回执行器（逐项查询仍 active / 查不清）」记「信息」不记「出错」；只改标注，不改平仓 / 补挂；0 = 一律记出错（默认，原行为），最多 600，Demo 建议 60，热生效
# reconcile_closing_grace_s = 0   # 对账员：第一次看到这笔在平仓起几秒内，「平仓结果尚未确认」「托管在退出阶段」「运行列表没返回执行器」「持仓数量对不上（币安已缩小或归零、方向一致）」记「信息」不记「出错」；只改标注；0 = 一律记出错（默认，原行为），最多 600，Demo 建议 60，热生效
#   回滚到没有这两项的旧版本前，先删掉这两行：旧版配置不认识的键（extra=forbid）会拒绝启动
# protection_readback_grace_s = 0  # Demo 托管保护：刚提交、交易所已回执接受的条件单，回执后几秒内查不到只重读不报错（不重发）；0 = 不等（默认，原行为），最多 30，改后重启
# protection_prearm_grace_s = 0    # Demo 托管保护：新仓还没完整托管时，同步失败（只限读延迟 / 网络一时失败，且已有确认的保命单或止损）最多连续容忍几秒再平仓，宽限内照样告警、下一轮重试；0 = 不容忍（默认，原行为），最多 600，改后重启
# protection_unknown_submit_grace_s = 0  # Demo 托管保护：条件单提交结果未知（超时 / 5xx）时，当场按原单号只查不重发最多几秒，查到就接着挂；等待期间这个币的平仓和整个托管保护轮询都暂停；仍查不到且已有确认的保命单或止损时，交给上一行的未托管宽限每轮再查（需要 protection_prearm_grace_s > 0 才会在之后每轮重查原单）；0 = 立即平仓（默认，原行为），最多 10，改后重启
# position_mode_cache_s = 0        # 持仓模式（单向 / 双向）查一次后几秒内不再查；0 = 每次都查（原行为）。这个查询占 30 权重，本地限流每秒 20；开新仓前、-4061、非单向持仓都会重查。Demo 建议 300。改后重启生效
# card_score_every_min = 60       # 面板每隔几分钟补算作战卡方向记分（发布时刻起算、扣掉同期币池，写 data/card_score/，只读公开 K 线）；0 = 不算，最多 1440；只有面板用，不用重启主循环，面板这一轮等完后生效
# card_score_window_days = 30     # 方向记分汇总最近几天出的卡；0 = 全部
# mainnet_shadow_on = false       # 按主网价格算：每笔平仓按同一时刻的主网成交价重算净盈亏，写 data/mainnet_shadow.jsonl，面板「历史」页并排显示；只用已有的主网行情推送，不额外请求币安；热生效。更早的平仓用 jiaoyi mainnet-shadow 补算
#   回滚到没有按主网价格算的旧版本前，先删掉 mainnet_shadow_on 这一行：旧版配置不认识的键（extra=forbid）会拒绝启动
#   回滚到没有方向记分的旧版本前，先删掉 card_score_every_min / card_score_window_days 这两行：旧版配置不认识的键（extra=forbid）会拒绝启动
# protection_leg_order = "lifeboat_first"  # Demo 托管保护：新仓三条腿的挂单顺序：lifeboat_first = 保命单 → 止损 → 止盈（默认，原行为）/ stop_first = 止损 → 止盈 → 保命单（交易所止损已能保护仓位，保命单只是更宽的后备）；stop_first 下止损确认后保命单挂失败不立即平仓，在 protection_prearm_grace_s 内告警并重试（被拒换新单号重挂，结果未知只查原单号），宽限用完照旧平；止损挂失败照旧立即平；网页「设置 → 执行 → 托管保护」也能改；改后重启
# hosted_close_mode = "hb_first"  # Demo 托管仓平仓顺序：hb_first = 先停 HB 执行器、等它结束再直连平仓（默认，原行为）/ direct = 决定平仓时先按持久化单号下只减仓市价单、再只停不平 HB，交易所止损挂到确认零仓后才撤；HB 已在自己平仓、保护腿或入场状态不明时照旧 hb_first；网页「设置 → 执行 → 托管保护」也能改；改后重启
#   回滚到没有 hosted_close_mode 的旧版本前，先删掉这一行，并等正在平仓的托管仓结束（平仓中的仓账本里有 direct_first）：旧版配置和账本不认识的键（extra=forbid）会拒绝启动
# hosted_close_direct_when_exiting = false  # Demo 托管仓、hosted_close_mode = "direct" 时：保护已进入退出（exiting）但没有腿触发、没有在途直连单或 HB 停止、HB 仍在跑且只有入场单，也照样先下只减仓市价单；全是单向只减仓，不会反向开仓；false = 进入退出就走 hb_first（默认，原行为）；网页「设置 → 执行 → 托管保护」也能改；改后重启
#   回滚到没有这一项的旧版本前，先删掉这一行：旧版配置不认识的键（extra=forbid）会拒绝启动
# protection_tick_alert_after = 1  # Demo 托管保护：后台保护轮同一笔仓连续失败几轮才发紧急告警「托管保护本轮未确认」，之前只记日志；1 = 每轮都发（默认，原行为）；改后重启
#   回滚到没有 protection_tick_alert_after 的旧版本前，先删掉这一行，并等账本里没有带 close_detail 的仓（因保护没确认而正在平仓的仓）：旧版配置和账本不认识的键（extra=forbid）会拒绝启动
# hb_stop_unknown_retries = 0   # Demo 托管仓：只停不平的 HB 停止结果未知、HB 仍报 RUNNING 时最多再补发几次（间隔 5、10、20… 秒翻倍；这种停止从不卖出）；0 = 不补发（原行为）；改后重启
#   回滚到没有 hb_stop_unknown_retries 的旧版本前，先删掉这一行，并等账本里没有带 direct_close_outcomes 的仓（直连平仓进行中的仓）：旧版配置和账本不认识的键（extra=forbid）会拒绝启动
# protection_stop_working_type = "CONTRACT_PRICE"         # Demo 托管保护：止损（含移动止损）按什么价触发：CONTRACT_PRICE = 最新成交价（默认，原行为）/ MARK_PRICE = 标记价（不被 Demo 瞬间插针扫掉，触发后仍按当时盘口市价成交）；只影响之后新挂的单，已挂的不动；保命单固定标记价；改后重启
# protection_take_profit_working_type = "CONTRACT_PRICE"  # Demo 托管保护：止盈按什么价触发，取值同上；默认 CONTRACT_PRICE（原行为）；只影响之后新挂的单；改后重启
# protection_trailing_book_mark_max_dev_bps = 30   # Demo 移动止损：算峰值用的盘口价往抬高峰值的方向偏离标记价（多仓买一高于 / 空仓卖一低于）超过几基点就当插针，这一轮不更新峰值 / 不激活；默认 30；0 = 不比对（不建议）；改后重启
# protection_trailing_stop_mark_buffer_bps = 5     # Demo 移动止损：挂新止损前，多仓要 < 标记价 ×（1 − 几基点）、空仓要 > 标记价 ×（1 + 几基点），否则这一轮不换代、旧止损留着；默认 5；改后重启
# protection_trailing_min_step_bps = 5             # Demo 移动止损：比正在挂的止损至少收紧几基点才撤旧挂新；默认 5；0 = 一有变化就换（旧行为）；改后重启
# protection_trailing_book_critical_after_s = 300  # Demo 移动止损：已激活却连续几秒拿不到有效盘口，告警升级为紧急；默认 300；0 = 一直只发提醒；改后重启

# 预测员 Kronos 怎么跑（整段可省略，省略就用下面的默认值）；开关是上面的 predictor_enabled
[predictor]
mode = "on_demand"                # on_demand = 只算作战卡里的币和有持仓的币（+ 哨兵出信号时补算）；all_symbols = 候选池全算
size_policy = "fixed"             # fixed = 一直用 model_size；adaptive = 按排队深度换 base / small / mini
model_size = "base"               # 预测模型：base = 最大（更准，每个币比标准慢 3–4 倍）/ small = 标准 / mini = 最快
adaptive_base_max_queue = 0       # adaptive：后面没人排队（≤ 0）用 base
adaptive_mini_min_queue = 3       # adaptive：排队 ≥ 3 个用 mini，中间用 small
backfill_bars = 400               # 启动时回填多少根预测员周期的 K 线（至少 64）
# interval = "5m"                   # 预测员 K 线周期（档位给：2h 及以下 5m，4h / 8h / 12h 15m，24h 1h）
# pred_len = 24                     # 往后预测几根（档位给，× interval = 覆盖最长持仓）
# lookback = 120                    # 回看几根 K 线（档位按官方 ≈ 5 × pred_len，至少 64；回看 + pred_len ≤ 512）
# paths = 10                        # 一次采样几条路径、模型平均成一条（官方 10）
# temperature = 0.6                 # 采样温度（官方 0.6）
# rank_band = 0.1667                # 全池排名前 / 后多少算看好 / 看坏（和卡一致才加分）
# rank_min_peers = 6                # 至少几个币一起预测才排名
# keeper_snapshot = "direction"     # 管家快照怎么带预测员：direction = 平均路径终点同向给 kronos.agree 1 / 0 + 全池名次（默认，原行为；p_up 只有 0 / 1 且多数是 0，做多多半 0、做空多半 1）/ rank = 只带名次 top / mid / bottom（和拍板加分同一个排名，多空对称）/ off = 不带；网页「设置」也能改；改后重启
#   回滚到没有 keeper_snapshot 的旧版本前，先删掉这一行：旧版配置不认识的键（extra=forbid）会拒绝启动
against_card_meeting = false      # 预测员连续看反作战卡时申请单币临时会；false = 只记录（预测员还在观察）

# 快环门槛（策略参数，不是硬上限；整段可省略，省略就用默认值；注释掉的是档位给的 2h 档旧默认，见 core/profiles.py）
[fast_loop]
jev_provider = "typesafe"         # typesafe = 直连（key: JEV_API_KEY）；openrouter = 经 OpenRouter（key: OPENROUTER_API_KEY）
# jev_model = "jev-1.14"          # M1 拿到 key 后填具体版本号（不许用 latest）；换版本要重新校准门槛
                                  # 走 openrouter 时写 OpenRouter 的名字，例如 "typesafe/jev-1.14"
rule_gate_without_jev = false     # 没有 Jev 时用不用规则版拍板人；默认不用 = 不开仓；只在 paper 生效，testnet / live 写了当关
jev_usd_per_mtok = 0.042          # Jev 每百万输入 token 的价格，记花费用
jev_max_consecutive_errors = 5    # 连续出错 5 次暂停调用；成功一次就清零
jev_error_cooldown_s = 60         # 暂停 60 秒后再试
# min_p_genuine = 0.6               # 拍板：真信号概率 ≥ 0.6（paper 不写 = 0.35；只在 six 生效）
# stop_floor_widen = true          # 止损离手续费太近：开 = 拉宽到下限、仓位按新止损重算；关 = 不开（不写 = 开）
# gate_questions = "one"            # 拍板人怎么问：one = 只问一道「做不做」（不写 = one）；six = 旧 6 道题（回放对照）
# min_p_take = 0.55                 # 拍板：“做”概率 ≥ 0.55（不写 = 0.55；想多做可放 0.50）
#                                   # 按信号类型单独定“做”门槛：见文件末尾的 [fast_loop.min_p_take_by_kind]
# min_p_direction = 0.45            # 拍板：信号方向概率 ≥ 0.45 且高于反方向（不写 = 0.45；只在 six 生效）
# max_p_toxic = 0.5                 # 拍板：订单流有毒概率 ≤ 0.5（paper 不写 = 0.60；只在 six 生效）
# predictor_weight = 0.2            # 预测员意见占几成：只有报 100% 才算看涨，与卡方向一致把“做”加 权重×0.5（0.2 → +0.10），相反不扣；0 = 不听
# gate_record_only = false         # 拍板只记不拦（不写 = 关；只在 paper 生效，testnet / live 写了当关）：门槛没过也放行并记下，毒性 ≥ 0.8 仍拦
signal_max_age_s = 5.0            # 信号从触发到风控员审完超过这么多秒就作废（开仓前行情最旧也按它）
size_fraction_s = 0.5             # 仓位档：S 用每笔风险的 5 成
size_fraction_m = 0.75            # M 用 7.5 成，L 用满
# leverage_clamp_to_bracket = false  # 杠杆按币安这个币的上限封顶（执行所 /fapi/v1/leverageBracket，启动时和之后每天拉）：在不超过原杠杆的档里挑能开最大仓位的杠杆、保证金按它重算、名义不超过该档上限 × 0.98；每笔风险和敞口上限不变；false = 原行为（超上限这笔开不了，如 XPLUSDT -4028）；热生效；回滚前先删掉这一行
# min_size_ratio = 0.0              # 缩单下限：被已有持仓占掉的可用保证金 / 总敞口或相关组余量、盘口深度把这笔压到计划风险（空仓时能开的大小）的这个比例以下就不开；单笔名义 / 杠杆分层 / 交易所最大数量等固定上限不算；0 = 关（原行为，Demo 建议 0）；热生效；回滚前先删掉这一行
# respect_card_notional_min = false # 作战卡不当硬约束时仍守卡上的名义价值下限（低于就不开，人工放行也拦）；false = 原行为（只当建议记下）；热生效；回滚前先删掉这一行
# atr_period_min = 15               # 止损用几分钟 K 线的 ATR（5 / 15 / 30 / 60）；作战卡的止损倍数按这个尺度给（独立设置，不随档位；止损 / 止盈 / ATR 周期的默认按它分段）
# stop_level_snap = false          # 止损贴关键位（外侧半个 ATR 内有关键位就挪到它外侧）：默认关，价格碰到关键位后 93% 会穿过 0.1 ATR
# stop_level_buffer_atr = 0.1       # 止损放在关键位外侧 0.1 ATR（独立设置，不随档位；止损 / 止盈 / ATR 周期的默认按它分段）
# atr_long_period_min = 60          # 长周期 ATR：止损 ATR = √(短 × 长)；0 = 只用短周期（档位给推荐值）
# session_factor = true             # 止损 ATR 再乘曼谷时段系数（表在档位里，档位给推荐值）
# stop_level_snap = false           # 止损挪到关键位外侧（默认关）
# atr_floor_7d = 0                  # 短周期 ATR 至少取 7 天中位数 × 这个数（0 = 关，默认）
