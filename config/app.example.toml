# opposite_card_ab = 0.0            # 反向卡 A/B：这个比例的事件（按持仓号 + 币 + 指令发布时间 + 方向固定抽签；整卡换版本不重抽）走新规则，其余照旧全平；0 = 不分组；只能配 confirm_or_tighten
# opposite_confirm_loss_r = 0.5     # 价格确认①：已亏到 0.5 倍原始止损距离就平（0 = 不用这条）
# opposite_confirm_atr = 1.0        # 价格确认②：看到这张卡后逆向走了 1 倍 ATR 就平（0 = 不用这条）
