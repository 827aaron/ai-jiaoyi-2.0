liq_drop_pct_5m = 1.0             # 且 5 分钟内被砸了 1% 以上
crowded_funding_rate = 0.0005     # 哨兵：资金费率绝对值 ≥ 0.05% 算拥挤
session_window_min = 5            # 哨兵：开盘 / 资金费结算前后 5 分钟
session_vol_ratio = 2.0

# 大盘方向变化：每 5 分钟检查，只独立更新大盘（不重跑各币会议）；以下均可热更新
market_review_on = true           # 提名单币复核，还需 schedule.event_meeting_enabled
regime_flip_on = true             # 模拟盘默认开
regime_flip_live = false          # 测试网 / 实盘也启用；默认关
regime_flip_target = "flash_market_only"  # 确认翻转后：flash_market_only = Flash 独立刷新大盘（以前的做法）；
                                  # desk = 让大盘台立即重跑；off = 只检查和记录。slow.toml [market_desk] mode = "replace" 时不能是 flash_market_only
regime_flip_breadth = 30          # 按 40 个有效币算反向至少 30 个；按比例；0 = 不限制
regime_flip_btc_pct = 1.0         # BTC 相比市场参照价至少同向走 1%；0 = 不限制
regime_flip_confirm = 2           # 连续 2 次同方向满足才更新大盘；0 = 不等连续确认
regime_flip_min_gap_min = 60      # 两次独立大盘更新至少隔 60 分钟；0 = 不限
regime_flip_min_symbols = 10      # 最少有效涨跌币数；持平、缺数据不计；0 = 不限制
regime_flip_check_min = 5         # 每隔几分钟检查；可填小数；0 = 停止定时检查
regime_flip_suspect_log_min = 30  # 连续同类疑似的文件记录间隔；0 = 每次记；面板始终每次记
regime_flip_price_max_age_min = 5 # BTC 参照行情最多旧几分钟；0 = 不限制（仍需有价格）
# 和作战卡相反的信号：有仓叫管家急查，同一个币反复出就申请单币临时会；不会开反方向的仓
against_signal_on = true          # false = 只记录（和以前一样）
against_dedup_s = 300             # 同一个币同一种反向信号 5 分钟内只算 1 次
against_grace_s = 180             # 开仓 3 分钟内的反向信号不算
against_recheck_cooldown_s = 300  # 同一笔仓 5 分钟内最多急查 1 次
against_strong_breakout_vol_ratio = 50.0  # 放量突破 / 瀑布反弹量 ≥ 50 倍才算强（基本不会）：一次就平只看是否已亏半个止损
against_loss_stop_frac = 0.5      # 已亏到 0.5 倍止损时也判 1 次就平；0 = 不用
against_meeting_count = 2         # 30 分钟内 2 次反向信号 → 申请单币临时会
against_meeting_window_s = 1800
against_meeting_gap_s = 3600      # 同一个币 60 分钟内最多申请 1 次
