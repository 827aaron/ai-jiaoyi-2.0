# 硬上限（你定，AI 改不了）。复制成 config/risk.toml 再改：make init-config
# 每一项都必填；缺项、拼错、数值不合理（负数、杠杆超过 125 等），程序拒绝启动。
# 数值由你定，程序不另设范围；下面是保守默认值（设计文档 §四、§十一），
# 超出保守值时 check-config / 面板会提示，但不拦。

risk_per_trade_pct = 1.0            # 每笔最多亏总资金 1%（0–100）
max_leverage = 5                    # 杠杆 ≤ 5 倍（1–125，具体币种以交易所为准）
max_total_exposure_x = 3.0          # 总敞口 ≤ 总资产 3 倍（0–125）
daily_loss_halt_pct = 3.0           # 当日亏 3% 停止开新仓，只允许平仓（0–100）
max_notional_per_trade_usdt = 2000  # 单笔名义价值上限 USDT（>0）
max_open_positions = 5              # 同时持仓笔数上限（≥1）
lifeboat_stop_multiplier = 1.5      # 保命止损距离 = 正常止损 × 1.5（>1）
max_spread_bps = 5.0                # 价差超过 5bp 不开仓
max_slippage_bps = 10.0
taker_fee_bps = 5.0                 # 单边吃单 0.05%，来回约 0.1%
min_tp_fee_multiple = 2.0           # 止盈至少覆盖来回手续费 2 倍
day_reset_tz = "Asia/Bangkok"       # 今日盈亏按曼谷 0 点清零；可改 "UTC"

[category_exposure_x]               # 每个相关组的敞口上限（总资产倍数），不能超过总敞口
major = 2.0
alt = 1.0
crypto_stock = 1.0
us_tech = 1.0
precious_metal = 1.0
other = 0.5
